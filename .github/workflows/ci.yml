name: ci

permissions:
  contents: read
on: [push, pull_request]
jobs:
  specs-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: make spec-validate
      - run: make python-test

  synthetic-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix web
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/run-local-browser-tests.py --artifacts artifacts/local-browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-artifacts
          path: artifacts/local-browser/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ffmpeg for real decoder tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web

  cloud-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/cloud-ingest
      - run: npm run typecheck --prefix apps/cloud-ingest
      - run: npm test --prefix apps/cloud-ingest

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        # runner 自带 Android SDK（ANDROID_HOME + cmdline-tools/latest）；
        # android-actions/setup-android@v3 会安装已从 SDK 仓库移除的 legacy 'tools' 包而失败
      - name: Accept SDK licenses and install platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/gradle/**') }}
      - name: Unit tests and debug APK
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  e2e-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/cloud-ingest
      - run: sh scripts/e2e-cloud.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-logs
          path: data/e2e/**/*.log
          if-no-files-found: ignore

  product-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --prefix web
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: make build web
      - run: python scripts/run-product-browser.py --skip-build --artifacts artifacts/product-browser
      - name: decision trail browser suite
        run: |
          cd web
          npm exec vite -- preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          cd ..
          BROWSER_ARTIFACT_DIR=artifacts/decision-browser BASE_URL=http://127.0.0.1:4173 python scripts/decision-trail-browser.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-browser-artifacts
          path: |
            artifacts/product-browser/
            artifacts/decision-browser/
          if-no-files-found: ignore

  docker-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate compose file
        run: |
          printf 'MEMORY_PROFILE_PASSWORD=ci-only-password\n' > ci.env
          docker compose --env-file ci.env config >/dev/null
      - name: Build and verify a disposable stack
        env:
          RUN_DOCKER_DEPLOYMENT_TEST: '1'
        run: python -m unittest discover -s scripts -p 'test_productization_deploy.py' -v
